---
- name: Identify the interface for the cluster ip
  ansible.builtin.set_fact:
    cluster_interface: "{{ item }}"
  loop: "{{ ansible_facts['interfaces'] }}"
  when:
    - ansible_facts['interfaces'] is defined
    - ansible_facts[item].ipv4 is defined
    - ansible_facts[item].ipv4.address | default('') == cluster_ip

- name: Check if an interface was defined for the cluster ip
  ansible.builtin.fail:
    msg: >-
      No interface defined for cluster ip {{ cluster_ip }}. 
      Check ipconfig0 in Terraform.
  when: cluster_interface is not defined

- name: Report the interface
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }}: Kubernetes will bind to {{ cluster_interface }} ({{ cluster_ip }})"

- name: Set route for management interface
  ansible.builtin.template:
    src: 10-mgmt-routes.network.j2
    dest: /etc/systemd/network/10-mgmt-route.network
    owner: root
    group: root
    mode: '0644'
  when:
    - mgmt_static_routes | default([])| length > 0
    - mgmt_interface is defined
  notify: Restart systemd-networkd

- name: Check for a legacy Kubernetes APT source
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/kubernetes.sources
  register: _kubernetes_apt_source

- name: Read the legacy Kubernetes APT source
  ansible.builtin.slurp:
    path: /etc/apt/sources.list.d/kubernetes.sources
  register: _kubernetes_apt_source_contents
  when: _kubernetes_apt_source.stat.exists

- name: Remove a malformed legacy Kubernetes APT source
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/kubernetes.sources
    state: absent
  when:
    - _kubernetes_apt_source.stat.exists
    - "'Suites: /' not in (_kubernetes_apt_source_contents.content | b64decode)"

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ ['curl', 'ca-certificates', 'python3-apt'] + common_packages_extra }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the non-privileged Teleport developer login on the jump host
  ansible.builtin.user:
    name: dev-user
    comment: Teleport developer login
    shell: /bin/bash
    create_home: true
    password_lock: true
  when: inventory_hostname in (groups['jump'] | default([]))

- name: Install qemu-guest-agent for KVM guests
  ansible.builtin.apt:
    name: qemu-guest-agent
    state: present
  when:
    - ansible_facts['virtualization_role'] | default('') == 'guest'
    - ansible_facts['virtualization_type'] | default('') in ['kvm', 'qemu', 'KVM']

- name: Check for the guest-agent virtio channel
  ansible.builtin.stat:
    path: /dev/virtio-ports/org.qemu.guest_agent.0
  register: _qga_dev
  when:
    - ansible_facts['virtualization_role'] | default('') == 'guest'
    - ansible_facts['virtualization_type'] | default('') in ['kvm', 'qemu', 'KVM']


- name: Enable qemu-guest-agent
  ansible.builtin.systemd:
    name: qemu-guest-agent
    enabled: true
    state: started
  when:
    - ansible_facts['virtualization_role'] | default('') == 'guest'
    - ansible_facts['virtualization_type'] | default('') in ['kvm', 'qemu', 'KVM']
    - _qga_dev.stat.exists

- name: Manage cluster block in /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED BLOCK: lab cluster"
    block: |
      {% for host in groups['lab'] %}
      {{ hostvars[host]['ansible_facts']['default_ipv4']['address'] }} {{ hostvars[host]['inventory_hostname'] }}.{{ lab_domain }} {{ hostvars[host]['inventory_hostname'] }}
      {% endfor %}
    state: present
  when: manage_etc_hosts | bool

- name: Disable cloud-init after first-boot provisioning
  ansible.builtin.file:
    path: /etc/cloud/cloud-init.disabled
    state: touch
    owner: root
    group: root
    mode: "0644"
    modification_time: preserve
    access_time: preserve
  when: manage_etc_hosts | bool
