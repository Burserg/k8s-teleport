---
- name: Ensure sshd drop dir exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Ensure sshd grabs files in drop dir
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: "Include /etc/ssh/sshd_config.d/*.conf"
    insertbefore: BOF
    state: present
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd

- name: Install hardening drop file
  ansible.builtin.template:
    src: 10_hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: '0644'
    validate: /usr/sbin/sshd -t -f /etc/ssh/sshd_config
  notify: Restart sshd

- name: Disable password auth on interactive accounts
  ansible.builtin.user:
    name: "{{ item }}"
    password_lock: true
  loop:
    - root
    - "{{ user }}"
  failed_when: false

- name: Flush handlers before checking config
  ansible.builtin.meta: flush_handlers

- name: Read effective sshd config
  ansible.builtin.command: sshd -T
  changed_when: false
  register: _sshd_effective

- name: Verify password auth is disabled
  ansible.builtin.assert:
    that:
      - "'passwordauthentication no' in _sshd_effective.stdout | lower"
    fail_msg: "Password authentication is not disabled in sshd config"
  when: ssh_disable_password_auth | bool
  