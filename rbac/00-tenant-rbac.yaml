---
apiVersion: v1
kind: Namespace
metadata:
  name: cheesecake
  labels:
    tenant: app-devs
    gateway-access: "true"
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-maintainer
  namespace: cheesecake
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  # Flux health checks follow a Deployment to its ReplicaSets. The tenant can
  # observe those derived resources but cannot modify them directly.
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways]
    verbs: [get, list, watch]     # read-only: needed to see attachment status
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get, list]
    
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-devs-maintain
  namespace: cheesecake
subjects:
  - kind: Group
    name: app-devs
    apiGroup: rbac.authorization.k8s.io
  - kind: ServiceAccount
    name: app-deployer
    namespace: cheesecake
roleRef:
  kind: Role
  name: app-maintainer
  apiGroup: rbac.authorization.k8s.io
