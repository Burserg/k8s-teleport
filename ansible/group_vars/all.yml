---
###
# The only Ansible file that should need modification
###

user: "{{ansible_user | default('ubuntu') }}"
kubeconfig: "/home/{{ user }}/.kube/config"
lab_domain: "lab.local"
###
# SSH Policy
###

ssh_disable_password_auth: true
ssh_permit_root_login: false
manage_etc_hosts: true

###
# Kubernetes config
###

k8s_minor: "1.36"
k8s_version: "1.36.2"
k8s_package_version: "1.36.2-2.1"
pod_subnet: "10.244.0.0/16"
service_subnet: "10.96.0.0/12"
control_plane_ip: "{{ hostvars[groups['control'][0]].cluster_ip }}"
control_plane_endpoint: "{{ groups['control'][0] }}.{{ lab_domain }}"
api_cert_sans:
  - "{{ control_plane_endpoint }}"
  - "{{ control_plane_ip }}"
etcd_heartbeat_interval: "100"
etcd_election_timeout: "1000"
helm_version: "3.16.3"
helm_sha256: "f5355c79190951eed23c5432a3b920e071f4c00a64f75e077de0dd4cb7b294ea"

###
# CNI / Gateway Config
###
cilium_version: "1.20.1"
gateway_api_version: "v1.6.1"
cilium_wireguard: true
cilium_cli_version: "0.19.7"
cilium_cli_sha256: "cd15e0983bf0acc7946cd05d453d1e58376ea92dec2642e745212df2b07d8852"
cilium_client_qps: 10
cilium_client_burst: 30
network_profile: l2
l2_announcement_interface_regex: "^(eth|eno|enp|br).*"

# Optional management-network routes. Can be empty if not used.
mgmt_interface: ""
mgmt_static_routes: []

###
# Storage
###
local_path_manifest: "https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.30/deploy/local-path-storage.yaml"
load_balancer_ip_start: "192.168.2.70"
load_balancer_ip_end: "192.168.2.127"
load_balancer_ingress_ip: "192.168.2.71"
load_balancer_teleport_ip: "192.168.2.72"

flux_version: "2.9.3"
flux_sha256: "eae4e8608c0ade2bf4e8dec1669dbb6b0c28b5822b252d97feccfb4fb1181fd2"

###
# TLS / Certs
###
cert_manager_version: "v1.21.1"
gateway_namespace: gateway-infra
gateway_name: lab-gateway
acme_email: "cory@devbycory.com"
acme_solver: "dns01"
#   letsencrypt-staging - untrusted root, browser warns:
#     staging rate limits are generous.
#   letsencrypt-prod - trusted cert. Production limits are strict
#     (5 duplicate certs/week)
# Changing this and re-running the playbook deletes the old TLS secret so
# cert-manager reissues from the new issuer immediately.
acme_issuer: "letsencrypt-prod"

# This goes in the ansible vault, but is left here for reference.
# Use "edit zone DNS" template
# Needed permissions:
# Permissions : Zone.Zone.Read, Zone.DNS.Edit
# Zone Resources : Include - Specific Zone - "domain.name"
# Client IP Address Filtering: Is In - <public facing IP>
cloudflare_api_token: ""

###
# Applications
###
app_namespace: cheesecake
app_hostname: "cheesecake.devbycory.com"
app_tenant_group: "app-devs"
app_tenant_user: "alice"
gitops_repo: "https://github.com/burserg/k8s-teleport.git"
gitops_branch: "main"
teleport_version: "18.10.0"
teleport_cluster_name: "teleport.devbycory.com"
