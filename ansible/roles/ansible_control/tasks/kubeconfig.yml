---
# This task file runs after kubeadm init. The initial ansible_control role runs
# before the control plane exists, so it cannot install a working kubeconfig.
- name: Read the cluster admin kubeconfig
  ansible.builtin.slurp:
    src: /etc/kubernetes/admin.conf
  register: _cluster_admin_kubeconfig
  no_log: true

- name: Create the kubeconfig directory on the control host
  ansible.builtin.file:
    path: "{{ control_kubeconfig | dirname }}"
    state: directory
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: "0700"
  delegate_to: "{{ controller_host }}"

- name: Install the cluster kubeconfig on the control host
  ansible.builtin.copy:
    content: "{{ _cluster_admin_kubeconfig.content | b64decode }}"
    dest: "{{ control_kubeconfig }}"
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: "0600"
  delegate_to: "{{ controller_host }}"
  no_log: true

- name: Create the RBAC admin output directory on the control host
  ansible.builtin.file:
    path: "{{ control_rbac_admin_kubeconfig | dirname }}"
    state: directory
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: "0700"
  delegate_to: "{{ controller_host }}"

- name: Copy the cluster kubeconfig into the control host RBAC output
  ansible.builtin.copy:
    content: "{{ _cluster_admin_kubeconfig.content | b64decode }}"
    dest: "{{ control_rbac_admin_kubeconfig }}"
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: "0600"
  delegate_to: "{{ controller_host }}"
  no_log: true

- name: Create the local RBAC admin output directory
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../rbac/out/admin"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Export the cluster kubeconfig to localhost
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ playbook_dir }}/../rbac/out/admin/admin.kubeconfig"
    flat: true
    fail_on_missing: true

- name: Restrict the local exported kubeconfig
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../rbac/out/admin/admin.kubeconfig"
    state: file
    mode: "0600"
  delegate_to: localhost
  become: false

- name: Verify kubectl uses the transferred kubeconfig on the control host
  ansible.builtin.command: "kubectl --kubeconfig {{ control_kubeconfig }} get --raw=/readyz"
  delegate_to: "{{ controller_host }}"
  become_user: "{{ user }}"
  changed_when: false
