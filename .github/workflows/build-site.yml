name: build-site
on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Lowercase the image owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.3.0
        id: build
        with:
          context: site
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/cheesecake-site:latest
            ghcr.io/${{ env.OWNER_LC }}/cheesecake-site:${{ github.sha }}
      - name: Record the build revision for Flux
        run: |
          sed -i "s#app.devbycory.com/image-build: .*#app.devbycory.com/image-build: ${GITHUB_SHA}#" gitops/apps/cheesecake/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet -- gitops/apps/cheesecake/deployment.yaml || {
            git add gitops/apps/cheesecake/deployment.yaml
            git commit -m "chore(site): deploy ${GITHUB_SHA}"
            git push
          }
