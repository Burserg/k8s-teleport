name: build-site
on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Lowercase the image owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.3.0
        with:
          context: site
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/cheesecake-site:latest
            ghcr.io/${{ env.OWNER_LC }}/cheesecake-site:${{ github.sha }}
      - name: Print the tag to pin
        run: echo "Pin gitops/apps/cheesecake/deployment.yaml to ghcr.io/${OWNER_LC}/cheesecake-site:${GITHUB_SHA}"
