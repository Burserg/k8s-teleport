---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cheesecake
  namespace: cheesecake
  labels:
    app: cheesecake
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cheesecake
  template:
    metadata:
      labels:
        app: cheesecake
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: ghcr.io/burserg/cheesecake-site:latest
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          volumeMounts:
            - name: cache
              mountPath: /tmp
          lifecycle:
            preStop:
              sleep:
                seconds: 2
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 2
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 10
      volumes:
        - name: cache
          emptyDir: {}
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: cheesecake

---
apiVersion: v1
kind: Service
metadata:
  name: cheesecake
  namespace: cheesecake
spec:
  selector:
    app: cheesecake
  ports:
    - name: http
      port: 80
      targetPort: 8080
